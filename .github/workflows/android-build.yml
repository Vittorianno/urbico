name: Android APK

# Gera o projeto nativo (pasta android/ com Gradle) com `expo prebuild`
# e compila o APK na nuvem. Nada disso precisa rodar na máquina local.
# Como usar: aba Actions > "Android APK" > Run workflow. O APK fica em
# "Artifacts" no fim da execução.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK (Gradle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Assinar APK para instalação local
        working-directory: android/app/build/outputs/apk/release
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/urbico-release.keystore \
            -storepass urbico-dev-only \
            -keypass urbico-dev-only \
            -alias urbico-dev \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Urbico Development,O=Urbico,C=BR"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/urbico-release.keystore \
            -storepass urbico-dev-only -keypass urbico-dev-only \
            app-release.apk urbico-dev
          jarsigner -verify -verbose app-release.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: urbico-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Enviar projeto android/ gerado (com Gradle)
        uses: actions/upload-artifact@v4
        with:
          name: urbico-android-project
          path: |
            android
            !android/**/build
            !android/.gradle
